# nginx do frontend: serve a SPA e faz proxy de /api para a API (mesma origem, sem CORS).

# Access log em JSON (uma linha por requisição) para o Graylog extrair os campos http_*.
# Sem query string ($uri), cookies, Authorization ou IP do cliente (LGPD / segredos fora dos logs).
log_format json_access escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","correlation_id":"$http_x_correlation_id",'
    '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status","protocol":"$server_protocol","user_agent":"$http_user_agent"}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /dev/stdout json_access;

    # API interna de migração (ADR-0005) nunca sai pelo proxy público, mesmo que a API passe a servi-la na 8080.
    location ^~ /api/v1/internal/ {
        include /etc/nginx/security-headers.conf;
        return 404;
    }

    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Mesmo id no access log do nginx e no log da API (campo request_id), para cruzar as duas fontes.
        proxy_set_header X-Request-Id $request_id;
        # Substitui (não concatena) o X-Forwarded-For para que o cliente não forje o IP usado no rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Arquivos com hash no nome podem ter cache longo.
    location ~* \.(?:js|css|woff2?|ico|svg)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # Rotas da SPA caem no index.html, que recebe o nonce de CSP desta requisição e nunca é cacheado.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        # sub_filter atua em text/html por padrão (declarar o tipo de novo gera aviso de MIME duplicado).
        sub_filter_once off;
        sub_filter "__CSP_NONCE__" $request_id;
        try_files $uri $uri/ /index.html;
    }
}

<header class="topbar">
  <a class="brand" routerLink="/">
    <span class="brand-mark" aria-hidden="true">L</span>
    <span>
      Legado
      <small i18n>Cadastro de Usuários</small>
    </span>
  </a>
  <nav>
    @if (auth.currentUser(); as user) {
      <a routerLink="/profile" routerLinkActive="active" i18n>Meu perfil</a>
      @if (auth.isAdmin()) {
        <a routerLink="/users" routerLinkActive="active" i18n>Usuários</a>
      }
      <span class="user-chip">
        <span class="avatar avatar--small" aria-hidden="true">{{ initials() }}</span>
        <span>{{ user.fullName }}</span>
      </span>
      <button type="button" class="btn btn--ghost btn--small" (click)="logout()" i18n>Sair</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active" i18n>Entrar</a>
      <a routerLink="/register" routerLinkActive="active" i18n>Criar conta</a>
    }
  </nav>
</header>
<main>
  <router-outlet />
</main>

# nginx do frontend: serve a SPA e faz proxy de /api para a API (mesma origem, sem CORS).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Substitui (não concatena) o X-Forwarded-For para que o cliente não forje o IP usado no rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Arquivos com hash no nome podem ter cache longo.
    location ~* \.(?:js|css|woff2?|ico|svg)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # Rotas da SPA caem no index.html, que recebe o nonce de CSP desta requisição e nunca é cacheado.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter "__CSP_NONCE__" $request_id;
        try_files $uri $uri/ /index.html;
    }
}

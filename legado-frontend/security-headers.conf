# Cabeçalhos de segurança comuns a todas as respostas (incluído em cada "location", porque um add_header
# dentro de location anula os herdados do server).
# CSP sem 'unsafe-inline': estilos inline do Angular só são aceitos com o nonce gerado por requisição
# ($request_id), e scripts só da própria origem. Trusted Types bloqueia injeção de HTML/script via DOM (XSS).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types angular angular#bundler" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
